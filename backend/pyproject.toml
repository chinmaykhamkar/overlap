[project]
name = "video-background-filter-backend"
version = "0.1.0"
description = "Backend service for real-time video background filtering with person segmentation"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "flask>=3.0.0",
    "flask-socketio>=5.4.1",
    "flask-cors>=4.0.0",
    "mediapipe>=0.10.14",
    "opencv-python>=4.9.0.80",
    "numpy>=1.24.0",
    "python-dotenv>=1.0.0",
    "pillow>=10.0.0",
    "python-socketio>=5.11.0",
    "eventlet>=0.35.2",
    "yt-dlp>=2024.8.6",
    "openai-whisper>=20231117",
    "pydub>=0.25.1"
]
